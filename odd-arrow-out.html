<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="theme-color" content="#eef5f1">
<title>Odd Arrow Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  .tile.found { color: var(--good); }
  .tile.miss { color: var(--bad); }
  .task svg { color: var(--arrow); }
</style>
</head>
<body>
<div class="app">
  <a class="back" href="index.html">← All homework</a>
  <header>
    <h1>Odd Arrow <span>Out</span></h1>
    <div class="level-ctl" aria-label="Level">
      <span class="lbl">Level</span>
      <button class="icon-btn" id="lvlDown" aria-label="Easier level">−</button>
      <span class="num" id="lvlNum">1</span>
      <button class="icon-btn" id="lvlUp" aria-label="Harder level">+</button>
    </div>
  </header>

  <div class="status">
    <div class="task">Find <span id="taskIcon"></span> <span class="dots" id="dots"></span></div>
    <div class="meta"><span>⏱ <b id="time">0</b>s</span><span>Oops <b id="miss">0</b></span></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="Arrow grid"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Ready, detective?</h2>
      <p id="ovText">Look carefully. Find every arrow that points the other way. Take your time. Careful eyes win stars!</p>
      <div class="stars" id="stars" hidden><span>★</span><span>★</span><span>★</span></div>
      <button class="big-btn" id="ovBtn">Let's go!</button>
      <button class="link-btn" id="ovAlt" hidden>Play this level again</button>
    </div>
  </div>

  <div class="tools">
    <button class="tool-btn" id="hintBtn" disabled>💡 Hint</button>
    <button class="tool-btn check" id="checkBtn" disabled hidden>✓ Check</button>
  </div>

  <div class="result" id="result" hidden>
    <p id="resultText"></p>
    <div class="result-actions">
      <button class="big-btn small" id="resNext">Next level</button>
      <button class="link-btn" id="resAgain">Try again</button>
    </div>
  </div>

  <footer>
    <span class="tip">3 stars = no oops. Look first, then tap.</span>
    <label><input type="checkbox" id="helper" autocomplete="off"> Show count &amp; Check button</label>
    <label><input type="checkbox" id="sound" checked> Sounds</label>
  </footer>
</div>

<script src="grid-game.js"></script>
<script>
  const arrow = deg => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(${deg}deg)"><path d="M20 12H5"/><path d="M11 5l-7 7 7 7"/></svg>`;

  startGridGame({
    storageKey: 'oddArrowLevel',
    targetName: 'odd arrows',
    maxLevel: 12,
    makeRound(level) {
      const size = Math.min(4 + Math.floor((level - 1) * 0.6), 10);
      const odd = Math.min(1 + Math.floor((level - 1) / 2), 6);
      // From level 4 the main direction can be up, down, left or right.
      const base = level >= 4 ? pick([0, 90, 180, 270]) : 0;
      const oddRot = base + 180;
      const oddSet = randomIndexes(size * size, odd);
      const cells = Array.from({ length: size * size }, (_, i) => ({
        html: arrow(oddSet.has(i) ? oddRot : base),
        label: 'arrow',
        target: oddSet.has(i)
      }));
      return { cols: size, cells, taskHtml: arrow(oddRot) };
    }
  });
</script>
</body>
</html>
